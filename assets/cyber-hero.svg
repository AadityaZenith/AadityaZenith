<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Aaditya Kumar — Cybersecurity, Cloud and AI</title>
  <desc id="desc">Animated cyber terminal banner with neon cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/><stop offset="55%" stop-color="#10152B"/><stop offset="100%" stop-color="#081C25"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55F7D4"><animate attributeName="stop-color" values="#55F7D4;#8B7CFF;#55F7D4" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#8B7CFF"><animate attributeName="stop-color" values="#8B7CFF;#55F7D4;#8B7CFF" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#55F7D4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1030" cy="60" r="180" fill="#7C8CFF" opacity=".08"><animate attributeName="r" values="160;205;160" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="270" r="220" fill="#55F7D4" opacity=".05"/>
    <rect x="28" y="25" width="1144" height="290" rx="17" fill="none" stroke="url(#neon)" stroke-opacity=".55"/>
    <path d="M28 70H1172" stroke="#55F7D4" stroke-opacity=".25"/>
    <circle cx="53" cy="48" r="5" fill="#FF6B8A"/><circle cx="72" cy="48" r="5" fill="#FFD166"/><circle cx="91" cy="48" r="5" fill="#55F7D4"/>
    <text x="115" y="53" fill="#9CB1C8" font-family="monospace" font-size="13">AADITYA@SECURE-SYSTEM: ~</text>
    <text x="72" y="128" fill="#EAF6FF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1">AADITYA KUMAR</text>
    <rect x="72" y="148" width="8" height="35" fill="url(#neon)" filter="url(#glow)"/>
    <text x="96" y="174" fill="url(#neon)" font-family="monospace" font-size="24" font-weight="700">SECURITY-MINDED BUILDER</text>
    <text x="72" y="216" fill="#B7C6D8" font-family="Arial, Helvetica, sans-serif" font-size="18">Cybersecurity  /  Cloud Engineering  /  AI</text>
    <text x="72" y="264" fill="#55F7D4" font-family="monospace" font-size="14">$ build --with-purpose --secure-by-design</text>
    <rect x="72" y="279" width="8" height="18" fill="#55F7D4">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(905 108)" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)">
      <path d="M0 34L90 0L180 34L180 138L90 172L0 138Z" opacity=".8"/>
      <path d="M36 48L90 27L144 48L144 124L90 145L36 124Z" opacity=".7"/>
      <path d="M64 67L90 55L116 67L116 105L90 117L64 105Z"/>
      <path d="M90 27V55M90 117V145M36 48L64 67M116 105L144 124M144 48L116 67M64 105L36 124" opacity=".75"/>
      <circle cx="90" cy="86" r="12" fill="#55F7D4" fill-opacity=".22">
        <animate attributeName="r" values="9;15;9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M820 80h60M850 65v30M1060 286h55M1087 273v26" stroke="#55F7D4" stroke-opacity=".55"/>
    <circle cx="860" cy="240" r="3" fill="#8B7CFF"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1125" cy="94" r="3" fill="#55F7D4"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
